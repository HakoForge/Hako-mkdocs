  - HakoForge-Lite 1:
    - Home: hf-l1/index.md
    - Specifications: hf-l1/specifications.md
    - Getting Started:
      - Welcome: hf-l1/welcome.md
      - Safety & Cautions: hf-l1/cautions.md
      - Power: hf-l1/power.md
      - Chassis Accessories: hf-l1/accessories.md
      - Hako Foundry: hf-l1/foundry.md
    - Hardware Guide:
      - Exploded View: hf-l1/hardware/exploded-view.md
      - Top Panel Removal: hf-l1/hardware/panel-removal.md
      - Wire Routing: hf-l1/hardware/wire-routing.md
      - Fan Installation: hf-l1/hardware/fan-installation.md
      - Cage Installation: hf-l1/hardware/cage-installation.md
      - Chassis Feet: hf-l1/hardware/chassis-feet.md
