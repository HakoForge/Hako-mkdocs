    - Backplanes:
      - Overview: hf-l1/backplanes/index.md
    - Support:
      - Warranty: hf-l1/warranty.md

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: yellow
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: yellow
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  logo: Logo.png
  favicon: imgs/Hako_Logo.ico

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - tables
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - glightbox

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Footer
extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:help@hakoforge.com
    - icon: fontawesome/brands/github
      link: https://github.com/hakoforge
  version:
    provider: mike