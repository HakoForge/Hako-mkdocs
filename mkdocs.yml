      - Fan Installation: hako-core/hardware/fan-installation.md
      - Lid Removal: hako-core/hardware/panel-removal.md
      - PCB Installation: hako-core/hardware/pcb-installation.md
      - Powerboard: hako-core/hardware/powerboard.md
      - Power Harness: hako-core/hardware/power-harness.md
